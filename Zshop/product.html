<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zshop product details — view sizing, pricing and description before adding an item to your cart.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236366f1'/%3E%3Ctext x='50' y='68' font-size='60' font-family='Arial, sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
  <title>Zshop | Product Details</title>
  <link rel="stylesheet" href="Zclothes.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo" style="text-decoration: none;">Z<span>shop</span></a>

      <!-- Back button explicitly linking back to index.html -->
      <a href="index.html" class="action-btn" style="text-decoration: none;">&larr; Back to Shop</a>

      <!-- Cart button in header -->
      <button id="open-cart-btn" class="cart-btn" aria-haspopup="dialog" aria-controls="cart-drawer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <main class="product-detail-container" id="product-detail">
    <!-- Loaded dynamically by JavaScript -->
  </main>

  <!-- Cart Drawer Overlay -->
  <div class="cart-overlay" id="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-drawer-title">
    <div class="cart-container">
      <div class="cart-header">
        <h2 id="cart-drawer-title">Your Cart</h2>
        <button class="close-btn" id="close-cart-btn" aria-label="Close cart">&times;</button>
      </div>
      <div class="cart-items" id="cart-items">
        <!-- Cart items rendered dynamically -->
      </div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total:</span>
          <span id="cart-total-price">$0</span>
        </div>
        <button class="order-btn" id="checkout-btn">Checkout</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-notification" class="toast-notification" role="status" aria-live="polite"></div>

  <script src="Zclothes.js"></script>
</body>
</html>
