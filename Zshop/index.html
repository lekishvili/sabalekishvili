<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Zshop — a modern apparel storefront demo built with vanilla HTML, CSS and JavaScript. Browse, filter and buy men's and women's streetwear.">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%236366f1'/%3E%3Ctext x='50' y='68' font-size='60' font-family='Arial, sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EZ%3C/text%3E%3C/svg%3E">
  <title>Zshop | Modern Apparel</title>
  <link rel="stylesheet" href="Zclothes.css">
</head>
<body>

  <header>
    <div class="nav-container">
      <a href="index.html" class="logo" style="text-decoration:none;">Z<span>shop</span></a>

      <!-- Search Bar aligned with Logo -->
      <form class="search-box" id="search-form" role="search">
        <label for="search-input" class="visually-hidden">Search products</label>
        <input type="text" id="search-input" placeholder="Search products..." autocomplete="off">
        <button type="submit" id="search-btn">Search</button>
      </form>

      <!-- Header Cart Button -->
      <button id="open-cart-btn" class="cart-btn" aria-haspopup="dialog" aria-controls="cart-drawer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </header>

  <main>
    <!-- Filter Action Bar directly below Header & above Products -->
    <div class="toolbar-section">
      <button id="open-filter-btn" class="filter-icon-btn" aria-label="Open filters" aria-haspopup="dialog" aria-controls="filter-modal" title="Filter Products">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="21" x2="4" y2="14"></line>
          <line x1="4" y1="10" x2="4" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="12"></line>
          <line x1="12" y1="8" x2="12" y2="3"></line>
          <line x1="20" y1="21" x2="20" y2="16"></line>
          <line x1="20" y1="12" x2="20" y2="3"></line>
          <line x1="1" y1="14" x2="7" y2="14"></line>
          <line x1="9" y1="8" x2="15" y2="8"></line>
          <line x1="17" y1="16" x2="23" y2="16"></line>
        </svg>
      </button>
    </div>

    <!-- Product Grid -->
    <section class="products-grid" id="products-grid" aria-live="polite">
      <!-- Products loaded dynamically via JavaScript -->
    </section>
  </main>

  <footer class="site-footer">
    <p>Built by <a href="#" target="_blank" rel="noopener">saba lekishvili</a> — a front-end portfolio project. <a href="https://github.com/" target="_blank" rel="noopener">View on GitHub</a></p>
  </footer>

  <!-- Filter Modal Overlay -->
  <div class="modal-overlay" id="filter-modal" role="dialog" aria-modal="true" aria-labelledby="filter-modal-title">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="filter-modal-title">Filters</h2>
        <button class="close-btn" id="close-filter-btn" aria-label="Close filters">&times;</button>
      </div>

      <div class="modal-body">
        <div class="filter-group-section">
          <h3>Gender</h3>
          <div class="radio-options">
            <label class="radio-card">
              <input type="radio" name="gender" value="all" checked>
              <span class="custom-radio"></span> All
            </label>
            <label class="radio-card">
              <input type="radio" name="gender" value="man">
              <span class="custom-radio"></span> Man
            </label>
            <label class="radio-card">
              <input type="radio" name="gender" value="woman">
              <span class="custom-radio"></span> Woman
            </label>
          </div>
        </div>

        <div class="filter-group-section">
          <h3>Clothing Type</h3>
          <div class="checkbox-options">
            <label class="checkbox-card"><input type="checkbox" value="shoes"> Shoes</label>
            <label class="checkbox-card"><input type="checkbox" value="pants"> Pants</label>
            <label class="checkbox-card"><input type="checkbox" value="shorts"> Shorts</label>
            <label class="checkbox-card"><input type="checkbox" value="shirts"> Shirts</label>
            <label class="checkbox-card"><input type="checkbox" value="hoodie"> Hoodie</label>
            <label class="checkbox-card"><input type="checkbox" value="hat"> Hat</label>
          </div>
        </div>

        <div class="filter-group-section">
          <h3>Max Price: $<span id="price-value">1000</span></h3>
          <label for="price-range" class="visually-hidden">Maximum price</label>
          <input type="range" id="price-range" min="10" max="1000" value="1000" step="10">
        </div>
      </div>

      <div class="modal-footer">
        <button id="reset-filters-btn" class="reset-btn">Reset</button>
        <button id="apply-filters-btn" class="apply-btn">Apply Filters</button>
      </div>
    </div>
  </div>

  <!-- Cart Drawer Overlay -->
  <div class="cart-overlay" id="cart-drawer" role="dialog" aria-modal="true" aria-labelledby="cart-drawer-title">
    <div class="cart-container">
      <div class="cart-header">
        <h2 id="cart-drawer-title">Your Cart</h2>
        <button class="close-btn" id="close-cart-btn" aria-label="Close cart">&times;</button>
      </div>
      <div class="cart-items" id="cart-items">
        <!-- Cart items rendered dynamically -->
      </div>
      <div class="cart-footer">
        <div class="cart-total">
          <span>Total:</span>
          <span id="cart-total-price">$0</span>
        </div>
        <button class="order-btn" id="checkout-btn">Checkout</button>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-notification" class="toast-notification" role="status" aria-live="polite"></div>

  <script src="Zclothes.js"></script>
</body>
</html>
